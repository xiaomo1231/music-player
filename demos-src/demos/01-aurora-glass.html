<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>01 极光玻璃 · 界面 demo</title>
<style>/*CORE_CSS*/
/* ===== 01 极光玻璃：参考 Apple Music 的毛玻璃与大字歌词 ===== */
:root{--mp-accent:hsl(var(--hue,200) 90% 70%);--mp-accent2:hsl(calc(var(--hue,200) + 60) 90% 70%);--mp-panel:rgba(30,30,40,.72);--mp-radius:16px}
body{background:#0b0b10;display:grid;grid-template-columns:232px 1fr;grid-template-rows:1fr auto}
.bg{position:fixed;inset:-10%;z-index:-1;filter:blur(90px) saturate(1.3);transition:opacity 1.5s}
.bg i{position:absolute;border-radius:50%;width:55vmax;height:55vmax;opacity:.55;animation:float 26s ease-in-out infinite alternate;transition:background 2s}
.bg i:nth-child(1){background:hsl(var(--hue) 80% 50%);left:-10%;top:-20%}
.bg i:nth-child(2){background:hsl(calc(var(--hue) + 70) 75% 45%);right:-15%;bottom:-30%;animation-duration:34s;animation-direction:alternate-reverse}
.bg i:nth-child(3){background:hsl(calc(var(--hue) + 300) 70% 40%);left:35%;top:30%;width:35vmax;height:35vmax;animation-duration:41s}
@keyframes float{to{transform:translate(12vw,9vh) scale(1.25)}}
aside{grid-row:1/3;margin:12px 0 12px 12px;border-radius:22px;background:rgba(255,255,255,.06);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.09);padding:18px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto}
aside h1{font-size:15px;margin:2px 10px 14px;display:flex;align-items:center;gap:8px;letter-spacing:.02em}
aside h1 i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--mp-accent),var(--mp-accent2))}
aside h6{margin:16px 10px 6px;font-size:11px;color:var(--mp-sub);font-weight:600;letter-spacing:.08em}
aside button{display:flex;align-items:center;gap:10px;background:none;border:0;padding:8px 10px;border-radius:10px;font-size:13.5px;text-align:left;transition:.2s}
aside button:hover{background:rgba(255,255,255,.07)}
aside button.on{background:rgba(255,255,255,.13)}
aside button .mp-ico{color:var(--mp-accent)}
aside .back{margin:auto 10px 0;padding-top:12px}
main{position:relative;min-height:0;min-width:0}
.stage{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:4vw;align-items:center;padding:3vh 5vw}
.deck{position:relative;width:min(100%,46vh,400px);aspect-ratio:1;justify-self:center}
.sleeve{position:absolute;inset:0;border-radius:18px;background-size:cover;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.12) inset;z-index:2;transition:transform .9s cubic-bezier(.2,.8,.2,1),background-image 1s}
.sleeve:after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(120deg,rgba(255,255,255,.28),transparent 35%)}
.vinylwrap{position:absolute;inset:4%;left:4%;transition:transform 1.1s cubic-bezier(.2,.8,.2,1);z-index:1}
.vinyl{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,#0000 0 19%,#111 19.5% 21%,#0000 21.5%),repeating-radial-gradient(circle,#1b1b1f 0 1.5px,#0c0c0e 2px 3.5px);box-shadow:0 10px 40px rgba(0,0,0,.6);position:relative}
.vinyl:before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 12%,rgba(255,255,255,.14) 18%,transparent 26% 62%,rgba(255,255,255,.1) 68%,transparent 76%)}
.vinyl i{position:absolute;inset:31%;border-radius:50%;background-size:cover;box-shadow:0 0 0 3px #0008}
.vinyl i:after{content:"";position:absolute;inset:44%;border-radius:50%;background:#0b0b10}
body.playing .sleeve{transform:translateX(-17%) rotate(-3deg)}
body.playing .vinylwrap{transform:translateX(30%)}
.glow{position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,hsl(var(--hue) 90% 60%/.5),transparent 62%);z-index:0;transform:scale(var(--lv,1));filter:blur(20px)}
.meta{position:absolute;left:0;right:0;top:calc(100% + 26px);text-align:center}
.meta b{font-size:22px;display:block}.meta span{color:var(--mp-sub);font-size:14px}
.lyr{height:min(70vh,640px);font-size:clamp(22px,2.6vw,38px);font-weight:800;line-height:1.3}
.lyr .mp-ly-line{padding:.42em 0;opacity:calc(.5 - var(--d,3)*.08);filter:blur(calc(var(--d,3)*.9px));transform-origin:left center;transform:scale(.94)}
.lyr .mp-ly-line.on{opacity:1;filter:none;transform:none}
.lyr .mp-ly-line.on span{background:linear-gradient(90deg,#fff calc(var(--lp,0)*100%),rgba(255,255,255,.45) calc(var(--lp,0)*100% + 8%));-webkit-background-clip:text;background-clip:text;color:transparent}
.lyr .mp-ly-line:hover{opacity:.9;filter:none}
main>.lib{position:absolute;inset:0}
footer{margin:0 12px 12px;border-radius:20px;background:rgba(255,255,255,.07);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.09);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:10px 18px}
.np{display:flex;align-items:center;gap:12px;min-width:0}
.np i{width:44px;height:44px;border-radius:10px;background-size:cover;flex:none}
.np b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.np span{font-size:12px;color:var(--mp-sub)}
.mid{display:grid;gap:6px;width:min(46vw,520px)}
.ctrl{display:flex;justify-content:center;align-items:center;gap:14px}
.ctrl button{background:none;border:0;font-size:17px;opacity:.75;padding:4px;transition:.2s}.ctrl button:hover{opacity:1;transform:scale(1.1)}
.ctrl button.on{color:var(--mp-accent);opacity:1}
.ctrl .pp{font-size:22px;width:42px;height:42px;border-radius:50%;background:#fff;color:#111;opacity:1;display:grid;place-items:center}
.bar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:11.5px;color:var(--mp-sub);font-variant-numeric:tabular-nums}
.line{height:5px;border-radius:5px;background:rgba(255,255,255,.16);position:relative;transition:height .2s}
.line:before{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--p,0)*100%);border-radius:5px;background:linear-gradient(90deg,var(--mp-accent),var(--mp-accent2))}
.line:hover{height:8px}
.right{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.right button{background:none;border:0;font-size:17px;opacity:.7;padding:6px;border-radius:8px}.right button:hover{opacity:1;background:rgba(255,255,255,.08)}
.right button span,.ctrl button span{display:none}
.right .line{width:90px}
/* 沉浸模式 */
body.immersive{grid-template-columns:minmax(0,1fr)}
body.immersive aside{display:none}
body.immersive footer{position:fixed;left:50%;bottom:18px;translate:-50% 0;width:min(900px,92vw);margin:0}
body.immersive .stage{padding:4vh 7vw}
body.immersive .deck{width:min(100%,56vh,520px)}
body.oled-black .sleeve,body.oled-black .vinyl{box-shadow:none}
@media(max-width:900px){body{grid-template-columns:64px 1fr}aside button span,aside h6,aside h1,aside .back{display:none}.stage{grid-template-columns:1fr;grid-template-rows:auto 1fr}.deck{width:min(60vw,30vh)}.meta{display:none}.lyr{height:34vh;font-size:22px;text-align:center}footer{grid-template-columns:1fr}.np,.right{display:none}.mid{width:100%}}
</style></head><body>
<div class="bg mp-bgfx"><i></i><i></i><i></i></div>
<aside data-static>
  <h1><i></i>极光玻璃</h1>
  <!--NAV-->
  <h6>工具</h6>
  <!--TOOLS-->
  <a class="back" href="index.html">← 全部 10 款风格</a>
</aside>
<main>
  <section data-view="now" class="stage on">
    <div class="deck" data-drift>
      <div class="glow mp-bgfx" id="glow"></div>
      <div class="vinylwrap"><div class="vinyl" id="vinyl"><i data-mp="cover"></i></div></div>
      <div class="sleeve" data-mp="cover"></div>
      <div class="meta"><b data-mp="title"></b><span><span data-mp="artist"></span> — <span data-mp="album"></span></span></div>
    </div>
    <div class="lyr" data-mp="lyrics" data-drift></div>
  </section>
  <!--VIEWS-->
</main>
<footer data-autohide>
  <div class="np"><i data-mp="cover"></i><div style="min-width:0"><b data-mp="title"></b><span data-mp="artist"></span> <span class="mp-fmt" data-mp="fmt"></span></div></div>
  <div class="mid"><div class="ctrl"><!--CTRL--></div>
    <div class="bar"><span data-mp="cur">0:00</span><div class="line" data-mp="progress"></div><span data-mp="dur"></span></div></div>
  <div class="right"><span data-icon="vol" style="opacity:.6"></span><div class="line" data-mp="vol"></div>
    <button data-mp="eq-open" data-icon="eq" title="均衡器"></button><button data-mp="oled-open" data-icon="oled" title="OLED 防烧屏"></button><button data-mp="mini" data-icon="mini" title="迷你播放器"></button><button data-mp="immersive" data-icon="expand" title="沉浸模式"></button></div>
</footer>
<script>/*CORE_JS*/</script>
<script>
MP.spin(document.getElementById('vinyl'),9);
const glow=document.getElementById('glow');
MP.on('frame',()=>glow.style.setProperty('--lv',(.9+MP.level()*.5).toFixed(3)));
</script>
</body></html>
