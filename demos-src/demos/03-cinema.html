<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>03 放映厅 · 界面 demo</title>
<style>/*CORE_CSS*/
/* ===== 03 放映厅：参考 Plex / Jellyfin 的海报墙与顶部导航，歌词做成字幕 ===== */
:root{--mp-accent:#f2a33a;--mp-accent2:#e2543a;--mp-bg:#0d0f14;--mp-panel:rgba(22,25,33,.94);--mp-radius:8px}
body{background:#0d0f14;display:grid;grid-template-rows:auto minmax(0,1fr)}
nav{display:flex;align-items:center;gap:4px;padding:10px 26px;background:linear-gradient(#000a,transparent);position:relative;z-index:5}
nav h1{font-size:17px;margin:0 22px 0 0;letter-spacing:.2em;font-weight:800}nav h1 em{color:var(--mp-accent);font-style:normal}
nav button{background:none;border:0;padding:8px 14px;border-radius:999px;font-size:13.5px;color:#fffa;display:flex;gap:7px;align-items:center;transition:.2s}
nav button:hover{color:#fff}nav button.on{background:#fff;color:#111;font-weight:600}
nav .sp{flex:1}nav .tools button span{display:none}nav .tools{display:flex}nav .tools button{padding:8px;font-size:17px}
main{position:relative;min-height:0}
.now{position:absolute;inset:0;overflow:hidden;display:grid;grid-template-rows:minmax(0,1fr) auto auto}
.backdrop{position:absolute;inset:-60px;background-size:cover;filter:blur(60px) brightness(.55) saturate(1.2);transform:scale(1.2);transition:background-image 1.2s;z-index:0}
.now:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0d0f14 0,transparent 55%),linear-gradient(0deg,#0d0f14 2%,transparent 50%);z-index:0;pointer-events:none}
.hero{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;padding:0 6vw;gap:4vw}
.info small{color:var(--mp-accent);font-weight:700;letter-spacing:.15em;font-size:12px}
.info h2{font-size:clamp(38px,5vw,76px);margin:.1em 0;line-height:1.05}
.info p{color:#fffb;margin:0 0 18px;font-size:15px}
.tags{display:flex;gap:8px;margin-bottom:22px}.tags span{border:1px solid #fff5;border-radius:4px;padding:2px 8px;font-size:11.5px;color:#fffc}
.btns{display:flex;gap:10px}
.btns button{border:0;border-radius:6px;padding:11px 22px;font-weight:700;background:#ffffff24;backdrop-filter:blur(10px);display:flex;gap:8px;align-items:center;font-size:14px}
.btns .pp{background:var(--mp-accent);color:#111}
.btns button span{display:inline}
.cdwrap{width:min(40vh,380px);aspect-ratio:1;position:relative}
.cd{width:100%;height:100%;border-radius:50%;background:conic-gradient(from 0deg,#d8dde8,#ffd5f3,#c9f3ff,#fff7c7,#d8dde8,#c2ffd9,#e3d2ff,#d8dde8);position:relative;box-shadow:0 20px 70px #000a}
.cd:before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,#0000 0 2px,#0001 3px 4px),radial-gradient(circle,#0000 0 15%,#fff8 15.5% 17%,#0000 17.5%)}
.cd i{position:absolute;inset:17%;border-radius:50%;background-size:cover;-webkit-mask:radial-gradient(circle,#0000 0 17%,#000 17.5%);mask:radial-gradient(circle,#0000 0 17%,#000 17.5%);opacity:.92}
.shine{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from var(--a,40deg),transparent 0 8%,#fff9 12%,transparent 18% 50%,#fff6 56%,transparent 62%);mix-blend-mode:overlay;pointer-events:none}
.subs{position:relative;z-index:2;text-align:center;padding:0 8vw 12px;min-height:5.2em}
.subs b{display:block;font-size:clamp(22px,2.6vw,36px);text-shadow:0 2px 12px #000;animation:subin .5s}
.subs span{color:#fff8;font-size:clamp(14px,1.4vw,19px)}
@keyframes subin{from{opacity:0;transform:translateY(8px)}}
.tl{position:relative;z-index:2;padding:0 6vw 12px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;font-size:12px;color:#fffa;font-variant-numeric:tabular-nums}
.line{height:4px;border-radius:4px;background:#fff3;position:relative}.line:before{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--p,0)*100%);background:var(--mp-accent);border-radius:4px}
.row{position:relative;z-index:2;padding:4px 6vw 22px}
.row h6{margin:0 0 10px;font-size:14px;color:#fffc}
.row [data-mp="albums"]{display:flex;gap:14px;overflow:auto;padding-bottom:6px}
.row .mp-card{flex:0 0 118px}.row .mp-card.on .mp-poster{outline:2px solid var(--mp-accent)}
main>.lib{position:absolute;inset:0;padding-top:14px}
.lib .mp-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
body.immersive nav,body.immersive .row{display:none}
body.immersive{grid-template-rows:minmax(0,1fr)}
body.immersive .cdwrap{width:min(52vh,520px)}body.immersive .subs b{font-size:clamp(28px,3.6vw,52px)}
body.oled-black .now:after{background:none}body.oled-black .backdrop{display:none}
@media(max-width:900px){nav button span{display:none}.hero{grid-template-columns:1fr;text-align:center}.cdwrap{width:30vh;justify-self:center;grid-row:1}.tags,.btns{justify-content:center}.row{display:none}}
</style></head><body>
<nav data-autohide data-static><h1>放映<em>厅</em></h1><!--NAV--><span class="sp"></span><div class="tools"><!--TOOLS--></div><a class="back" href="index.html" style="margin-left:10px">全部风格</a></nav>
<main>
  <section data-view="now" class="now on">
    <div class="backdrop mp-bgfx" data-mp="cover"></div>
    <div class="hero">
      <div class="info"><small>正在播放 · 音乐</small><h2 data-mp="title"></h2><p><span data-mp="artist"></span> · <span data-mp="album"></span></p>
        <div class="tags"><span data-mp="fmt"></span><span>比特完美</span><span>内嵌歌词</span><span>ReplayGain</span></div>
        <div class="btns" data-autohide><button class="pp" data-mp="play" data-keep id="ppb"></button><button data-mp="prev" data-icon="prev"><span>上一首</span></button><button data-mp="next" data-icon="next"><span>下一首</span></button><button data-mp="immersive" data-icon="expand"><span>影院模式</span></button></div></div>
      <div class="cdwrap" data-drift><div class="cd" id="cd"><i data-mp="cover"></i></div><div class="shine" id="shine"></div></div>
    </div>
    <div class="subs" data-drift><b data-mp="lyric-now" id="sub"></b><span data-mp="lyric-next"></span></div>
    <div class="tl" data-autohide><span data-mp="cur"></span><div class="line" data-mp="progress"></div><span data-mp="remain"></span></div>
    <div class="row" data-autohide><h6>接下来播放</h6><div data-mp="albums"></div></div>
  </section>
  <!--VIEWS-->
</main>
<script>/*CORE_JS*/</script>
<script>
MP.spin(document.getElementById('cd'),14);
const shine=document.getElementById('shine'),sub=document.getElementById('sub'),ppb=document.getElementById('ppb');
MP.on('frame',f=>shine.style.setProperty('--a',(40+Math.sin(f.now/1800)*25+MP.level()*40)+'deg'));
MP.on('lyric',()=>{sub.style.animation='none';void sub.offsetWidth;sub.style.animation=''});
const pp=()=>ppb.innerHTML=MP.icon(MP.state.playing?'pause':'play')+'<span>'+(MP.state.playing?'暂停':'播放')+'</span>';
MP.on('play',pp);MP.on('pause',pp);pp();
const mark=()=>MP.$$('.row .mp-card').forEach(c=>c.classList.toggle('on',+c.dataset.i===MP.state.idx));MP.on('track',mark);mark();
</script></body></html>
