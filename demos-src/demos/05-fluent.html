<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>05 云母 · 界面 demo</title>
<style>/*CORE_CSS*/
/* ===== 05 云母：参考 Windows 11 Fluent 的浅色云母材质，带唱臂的转盘 ===== */
:root{--mp-accent:#0067c0;--mp-accent2:#4cc2ff;--mp-bg:#f3f3f3;--mp-panel:rgba(249,249,249,.92);--mp-panel2:rgba(0,0,0,.045);--mp-text:#1b1b1b;--mp-sub:#5f5f5f;--mp-line:rgba(0,0,0,.09);--mp-radius:8px;--mp-shadow:0 16px 48px rgba(0,0,0,.18);--card:#ffffffb8;--tint:hsl(var(--hue,200) 70% 92%)}
body{background:linear-gradient(135deg,var(--tint),#f3f3f3 45%,hsl(calc(var(--hue,200) + 60) 60% 93%));transition:background 1s,translate 2.5s;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:32px minmax(0,1fr) auto}
.title{grid-column:1/-1;display:flex;align-items:center;font-size:12px;padding-left:14px;color:var(--mp-sub)}
.title span{flex:1}.title i{width:46px;height:32px;display:grid;place-items:center;font-style:normal;font-size:10px}.title i:last-child:hover{background:#c42b1c;color:#fff}
aside{width:232px;padding:4px 6px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
aside button{display:flex;gap:14px;align-items:center;background:none;border:0;padding:9px 12px;border-radius:5px;font-size:13.5px;text-align:left;position:relative}
aside button:hover{background:#0000000d}aside button.on{background:#00000010}
aside button.on:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--mp-accent)}
aside hr{border:0;border-top:1px solid var(--mp-line);margin:8px 4px;width:calc(100% - 8px)}
aside .back{margin:auto 12px 0}
main{background:var(--card);border:1px solid #0000000f;border-radius:8px 0 0 0;min-height:0;position:relative;overflow:hidden}
.now{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:3vw;padding:3vh 4vw}
.tt{position:relative;width:min(100%,56vh,460px);aspect-ratio:1.12;justify-self:center;border-radius:14px;background:linear-gradient(160deg,#fff,#ececec);box-shadow:0 2px 4px #0001,0 18px 40px #0000001f;border:1px solid #0000000d}
.plat{position:absolute;left:6%;top:8%;width:75%;aspect-ratio:1;border-radius:50%;background:#d9d9d9;box-shadow:inset 0 2px 8px #0003}
.rec{position:absolute;inset:3%;border-radius:50%;background:repeating-radial-gradient(circle,#232323 0 1.5px,#161616 2px 3.5px);box-shadow:0 4px 14px #0005}
.rec:before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,transparent 0 10%,#ffffff26 16%,transparent 24% 60%,#ffffff1c 66%,transparent 74%)}
.rec i{position:absolute;inset:30%;border-radius:50%;background-size:cover}.rec i:after{content:"";position:absolute;inset:45%;border-radius:50%;background:#eee}
.arm{position:absolute;right:9%;top:7%;width:7%;height:62%;transform-origin:50% 9%;transform:rotate(-24deg);transition:transform 1.1s cubic-bezier(.3,1.2,.4,1)}
.arm:before{content:"";position:absolute;left:50%;top:0;width:260%;aspect-ratio:1;translate:-50% 0;border-radius:50%;background:radial-gradient(circle,#fafafa 0 30%,#c8c8c8 32% 100%);box-shadow:0 2px 6px #0004}
.arm:after{content:"";position:absolute;left:50%;top:9%;bottom:8%;width:22%;translate:-50% 0;background:linear-gradient(90deg,#bbb,#f4f4f4,#aaa);border-radius:4px}
.arm b{position:absolute;left:50%;bottom:0;width:120%;height:16%;translate:-50% 0;rotate:18deg;border-radius:3px;background:var(--mp-accent);z-index:2}
.knob{position:absolute;right:8%;bottom:8%;display:flex;gap:10px;align-items:center;font-size:10.5px;color:var(--mp-sub)}
.knob u{width:9px;height:9px;border-radius:50%;background:#bbb;text-decoration:none;transition:.3s}body.playing .knob u{background:#22c55e;box-shadow:0 0 8px #22c55e}
.rt{display:grid;grid-template-rows:auto minmax(0,1fr);height:min(72vh,620px)}
.rt h2{font-size:30px;margin:0;font-weight:600}.rt p{margin:6px 0 14px;color:var(--mp-sub);font-size:14px}
.lyr{font-size:19px;line-height:1.45}
.mp-ly-line{padding:.5em 0;color:#00000059;transform-origin:left;transition:.5s}
.mp-ly-line.on{color:var(--mp-text);font-size:1.4em;font-weight:600}
.mp-ly-line.on span{background:linear-gradient(90deg,var(--mp-accent) calc(var(--lp,0)*100%),var(--mp-text) calc(var(--lp,0)*100% + 4%));-webkit-background-clip:text;background-clip:text;color:transparent}
main>.lib{position:absolute;inset:0}
footer{grid-column:1/-1;display:grid;grid-template-columns:1fr minmax(0,1.3fr) 1fr;gap:18px;align-items:center;padding:10px 18px;background:#ffffff8c;backdrop-filter:blur(30px);border-top:1px solid #0000000f}
.np{display:flex;gap:12px;align-items:center}.np i{width:46px;height:46px;border-radius:6px;background-size:cover}.np b{display:block;font-size:13.5px;font-weight:600}.np span{font-size:12px;color:var(--mp-sub)}
.mid{display:grid;gap:4px}.ctrl{display:flex;justify-content:center;gap:10px;align-items:center}
.ctrl button{background:none;border:0;width:36px;height:36px;border-radius:6px;font-size:16px;display:grid;place-items:center}.ctrl button:hover{background:#0000000d}.ctrl button.on{color:var(--mp-accent)}
.ctrl .pp{background:var(--mp-accent);color:#fff;border-radius:50%;width:42px;height:42px;font-size:19px}.ctrl .pp:hover{background:#1975c5}
.bar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:11.5px;color:var(--mp-sub);font-variant-numeric:tabular-nums}
.line{height:4px;border-radius:4px;background:#0000002e;position:relative}.line:before{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--p,0)*100%);background:var(--mp-accent);border-radius:4px}
.line:after{content:"";position:absolute;left:calc(var(--p,0)*100% - 8px);top:-6px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0005,inset 0 0 0 4px #fff,inset 0 0 0 9px var(--mp-accent)}
.right{display:flex;justify-content:flex-end;gap:4px;align-items:center}.right button{background:none;border:0;width:34px;height:34px;border-radius:6px;font-size:16px}.right button:hover{background:#0000000d}.right .line{width:90px;margin:0 10px}
/* 深色（OLED 纯黑时自动切换） */
body.oled-black{--mp-text:#f2f2f2;--mp-sub:#9a9a9a;--mp-panel:rgba(20,20,20,.94);--mp-panel2:rgba(255,255,255,.06);--mp-line:rgba(255,255,255,.1);--mp-accent:#4cc2ff;--card:#000;color:#f2f2f2}
body.oled-black footer{background:#000;border-color:#1a1a1a}body.oled-black .tt{background:#0a0a0a;box-shadow:none;border-color:#1c1c1c}body.oled-black .plat{background:#141414}
body.oled-black .mp-ly-line{color:#ffffff4d}body.oled-black aside button:hover,body.oled-black aside button.on{background:#ffffff14}
body.immersive{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}body.immersive aside,body.immersive .title{display:none}
body.immersive main{border-radius:0;border:0;background:transparent}body.immersive .tt{width:min(100%,64vh,560px)}body.immersive .lyr{font-size:24px}
@media(max-width:900px){aside{width:56px}aside button span,aside .back{display:none}.now{grid-template-columns:1fr}.tt{width:min(70vw,34vh)}.rt{height:36vh}.np,.right{display:none}footer{grid-template-columns:1fr}}
</style></head><body>
<div class="title" data-static><span>云母 · 媒体中心</span><i>─</i><i>☐</i><i>✕</i></div>
<aside data-static><!--NAV--><hr><!--TOOLS--><a class="back" href="index.html">← 全部 10 款风格</a></aside>
<main>
  <section data-view="now" class="now on">
    <div class="tt" data-drift><div class="plat"><div class="rec" id="rec"><i data-mp="cover"></i></div></div><div class="arm" id="arm"><b></b></div><div class="knob"><u></u>33⅓ RPM · <span data-mp="fmt"></span></div></div>
    <div class="rt" data-drift><div><h2 data-mp="title"></h2><p><span data-mp="artist"></span> · <span data-mp="album"></span></p></div><div class="lyr" data-mp="lyrics" data-pos=".38"></div></div>
  </section>
  <!--VIEWS-->
</main>
<footer data-autohide>
  <div class="np"><i data-mp="cover"></i><div><b data-mp="title"></b><span data-mp="artist"></span></div></div>
  <div class="mid"><div class="ctrl"><!--CTRL--></div><div class="bar"><span data-mp="cur"></span><div class="line" data-mp="progress"></div><span data-mp="dur"></span></div></div>
  <div class="right"><span data-icon="vol"></span><div class="line" data-mp="vol"></div><button data-mp="eq-open" data-icon="eq" title="均衡器"></button><button data-mp="oled-open" data-icon="oled" title="OLED 防烧屏"></button><button data-mp="mini" data-icon="mini" title="迷你播放器"></button><button data-mp="immersive" data-icon="expand" title="沉浸模式"></button></div>
</footer>
<script>/*CORE_JS*/</script>
<script>
MP.spin(document.getElementById('rec'),33.3/4);
const arm=document.getElementById('arm');
// 唱臂随播放进度从外圈慢慢移向内圈，暂停时抬起归位
MP.on('frame',()=>{const s=MP.state;arm.style.transform=`rotate(${s.playing?4+(s.t/s.dur)*17+MP.level()*.6:-24}deg)`});
</script></body></html>
