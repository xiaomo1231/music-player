<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>07 霓虹落日 · 界面 demo</title>
<style>/*CORE_CSS*/
/* ===== 07 霓虹落日：原创合成器浪潮风格，环形频谱 + 透视网格 ===== */
:root{--mp-accent:#ff3df0;--mp-accent2:#22e6ff;--mp-bg:#0a0218;--mp-panel:rgba(22,6,44,.9);--mp-radius:4px;--mp-line:rgba(255,61,240,.28);--mp-sub:#b79bd8;--mp-font:"Bahnschrift","Segoe UI","Microsoft YaHei UI",sans-serif}
body{background:#0a0218}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.ui{position:fixed;inset:0;z-index:1;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
nav{display:flex;align-items:center;gap:4px;padding:12px 22px}
nav h1{margin:0 18px 0 0;font-size:20px;font-style:italic;letter-spacing:.06em;background:linear-gradient(#fff,var(--mp-accent));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px #ff3df0aa)}
nav button{background:none;border:1px solid transparent;padding:6px 12px;font-size:13px;color:#e9d8ff;letter-spacing:.06em;display:flex;gap:6px;align-items:center;transition:.2s;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
nav button:hover{color:var(--mp-accent2);text-shadow:0 0 10px var(--mp-accent2)}
nav button.on{background:var(--mp-accent);color:#0a0218;font-weight:700;box-shadow:0 0 18px #ff3df099}
nav .sp{flex:1}nav .tools{display:flex}nav .tools button span{display:none}nav .tools button{padding:6px 9px;font-size:16px}
main{position:relative;min-height:0}
.now{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center}
.ring{position:relative;justify-self:center;width:min(44vw,62vh);aspect-ratio:1;display:grid;place-items:center}
.disc{width:46%;aspect-ratio:1;border-radius:50%;background-size:cover;box-shadow:0 0 0 3px #0a0218,0 0 0 5px var(--mp-accent2),0 0 50px #22e6ff88;position:relative}
.disc:after{content:"";position:absolute;inset:42%;border-radius:50%;background:#0a0218;box-shadow:0 0 0 2px var(--mp-accent)}
.rt{padding-right:6vw;display:grid;grid-template-rows:auto minmax(0,1fr);height:min(66vh,560px)}
.rt h2{margin:0;font-size:clamp(30px,3.6vw,54px);font-style:italic;text-transform:uppercase;letter-spacing:.02em;color:#fff;text-shadow:0 0 6px #fff,0 0 22px var(--mp-accent),0 0 46px var(--mp-accent)}
.rt p{margin:6px 0 16px;color:var(--mp-accent2);letter-spacing:.2em;font-size:13px;text-shadow:0 0 10px #22e6ff99}
.lyr{font-size:clamp(17px,1.7vw,24px);line-height:1.4}
.mp-ly-line{padding:.45em 0;color:#b79bd880}
.mp-ly-line.on{color:#fff;font-size:1.35em;font-weight:700;text-shadow:0 0 8px var(--mp-accent2),0 0 26px var(--mp-accent2);animation:flick 3s infinite}
@keyframes flick{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.6}49%{opacity:1}}
main>.lib{position:absolute;inset:0;background:#0a0218d9;backdrop-filter:blur(8px)}
.lib>header h2{font-style:italic;text-shadow:0 0 16px var(--mp-accent)}.mp-poster{border-radius:2px;box-shadow:0 0 0 1px var(--mp-accent2),0 0 18px #22e6ff44}
footer{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:12px 24px;background:linear-gradient(transparent,#0a0218)}
.ctrl{display:flex;gap:10px;align-items:center}.ctrl button{background:none;border:0;font-size:18px;color:#e9d8ff}.ctrl button:hover,.ctrl button.on{color:var(--mp-accent2);filter:drop-shadow(0 0 6px var(--mp-accent2))}
.ctrl .pp{width:44px;height:44px;border:2px solid var(--mp-accent);border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 0 16px #ff3df0aa,inset 0 0 12px #ff3df066}
.line{height:3px;background:#ffffff26;position:relative}.line:before{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--p,0)*100%);background:linear-gradient(90deg,var(--mp-accent),var(--mp-accent2));box-shadow:0 0 12px var(--mp-accent2)}
.line:after{content:"";position:absolute;left:calc(var(--p,0)*100% - 5px);top:-4px;width:10px;height:10px;rotate:45deg;background:#fff;box-shadow:0 0 12px #fff}
footer span{font-size:12px;color:var(--mp-sub);font-variant-numeric:tabular-nums;letter-spacing:.08em}footer .line.v{width:90px}
body.immersive nav{opacity:0;pointer-events:none}body.immersive:not(.idle) nav{opacity:1;pointer-events:auto}
@media(max-width:900px){nav button span{display:none}.now{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.ring{width:min(70vw,36vh)}.rt{padding:0 8vw;height:100%;text-align:center}footer{grid-template-columns:auto minmax(0,1fr) auto}footer .line.v,footer>span:first-of-type{display:none}}
</style></head><body>
<canvas id="fx"></canvas>
<div class="ui">
<nav data-static data-autohide><h1>NEON//落日</h1><!--NAV--><span class="sp"></span><div class="tools"><!--TOOLS--></div><a class="back" href="index.html" style="margin-left:10px">全部风格</a></nav>
<main>
  <section data-view="now" class="now on">
    <div class="ring" id="ring" data-drift><div class="disc" id="disc" data-mp="cover"></div></div>
    <div class="rt" data-drift><div><h2 data-mp="title"></h2><p><span data-mp="artist"></span> // <span data-mp="fmt"></span></p></div><div class="lyr" data-mp="lyrics" data-pos=".4"></div></div>
  </section>
  <!--VIEWS-->
</main>
<footer data-autohide><div class="ctrl"><!--CTRL--></div><span data-mp="cur"></span><div class="line" data-mp="progress"></div><span data-mp="dur"></span><div class="line v" data-mp="vol"></div></footer>
</div>
<script>/*CORE_JS*/</script>
<script>
MP.spin(document.getElementById('disc'),10);
const ring=document.getElementById('ring');let gz=0;const stars=Array.from({length:90},()=>[Math.random(),Math.random()*.5,Math.random()]);
MP.canvas(document.getElementById('fx'),(g,w,h,t,dt)=>{
  const black=document.body.classList.contains('oled-black'),lv=MP.level(),hz=h*.58,now=document.body.dataset.view==='now';
  g.clearRect(0,0,w,h);
  if(!black){const sky=g.createLinearGradient(0,0,0,hz);sky.addColorStop(0,'#0a0218');sky.addColorStop(1,'#3a0a5c');g.fillStyle=sky;g.fillRect(0,0,w,hz);
    stars.forEach(s=>{g.globalAlpha=.3+.7*Math.abs(Math.sin(t*s[2]*2+s[0]*9));g.fillStyle='#fff';g.fillRect(s[0]*w,s[1]*h,1.5,1.5)});g.globalAlpha=1;
    // 落日
    const rb=ring.getBoundingClientRect(),sr=h*.2*(1+lv*.06),sx=now&&rb.width?rb.left+rb.width/2:w*.5,sy=hz-sr*.25;const sg=g.createLinearGradient(0,sy-sr,0,sy+sr);sg.addColorStop(0,'#ffe14d');sg.addColorStop(.55,'#ff3df0');sg.addColorStop(1,'#7a1cff');
    g.save();g.beginPath();g.rect(0,0,w,hz);g.clip();g.shadowColor='#ff3df0';g.shadowBlur=60;g.fillStyle=sg;g.beginPath();g.arc(sx,sy,sr,0,7);g.fill();g.shadowBlur=0;
    g.globalCompositeOperation='destination-out';for(let i=0;i<7;i++){const y=sy+sr*(.05+i*.14)+((t*8)%(sr*.14));g.fillRect(sx-sr,y,sr*2,2+i*1.6)}g.restore();
    g.fillStyle='#0a0218';g.fillRect(0,hz,w,h-hz)}
  // 透视网格
  gz=(gz+dt*(MP.state.playing?.9:.12)*(1+lv))%1;g.strokeStyle=black?'#3a1466':'#ff3df0';g.lineWidth=1;g.shadowColor='#ff3df0';g.shadowBlur=black?0:8;g.beginPath();
  for(let i=-16;i<=16;i++){g.moveTo(w/2+i*w*.012,hz);g.lineTo(w/2+i*w*.16,h)}
  for(let i=0;i<14;i++){const z=(i+gz)/14,y=hz+(h-hz)*z*z;g.moveTo(0,y);g.lineTo(w,y)}g.stroke();g.shadowBlur=0;
  // 环形频谱
  if(now){const r=ring.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=r.width*.27,n=96,s=MP.spectrum(n/2);
    for(let i=0;i<n;i++){const v=s[i<n/2?i:n-1-i],a=i/n*Math.PI*2-Math.PI/2+t*.1,len=6+v*r.width*.2;
      g.strokeStyle=`hsl(${300+(i<n/2?i:n-i)/n*2*-120} 100% 62%)`;g.lineWidth=Math.max(2,R*6.28/n*.55);g.lineCap='round';g.shadowColor=g.strokeStyle;g.shadowBlur=black?0:12;
      g.beginPath();g.moveTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);g.lineTo(cx+Math.cos(a)*(R+len),cy+Math.sin(a)*(R+len));g.stroke()}g.shadowBlur=0}
});
</script></body></html>
