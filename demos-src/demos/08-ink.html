<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>08 水墨 · 界面 demo</title>
<style>/*CORE_CSS*/
/* ===== 08 水墨：原创东方留白设计，旋转的墨圈与竖排歌词 ===== */
:root{--mp-accent:#b3321f;--mp-accent2:#5a6e62;--mp-bg:#f1ece0;--mp-panel:rgba(244,240,229,.96);--mp-panel2:rgba(30,25,20,.05);--mp-text:#1f1c18;--mp-sub:#7d776c;--mp-line:rgba(30,25,20,.14);--mp-radius:2px;--mp-font:"Kaiti SC","KaiTi","STKaiti","Songti SC","SimSun",serif;--mp-shadow:0 18px 50px rgba(30,25,20,.22);--ink:#1f1c18;--paper:#f1ece0}
body{background:var(--paper);transition:background .8s,translate 2.5s}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.ui{position:fixed;inset:0;z-index:1;display:grid;grid-template-columns:76px minmax(0,1fr)}
aside{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 0;border-right:1px solid var(--mp-line)}
aside h1{writing-mode:vertical-rl;font-size:24px;letter-spacing:.3em;margin:0 0 8px;font-weight:400}
aside>*{flex:none}
aside button span{writing-mode:vertical-rl;display:block}
aside button{background:none;border:0;font-size:14px;letter-spacing:.14em;padding:7px 6px;color:var(--mp-sub);position:relative;transition:.3s}
aside button .mp-ico{display:none}aside button:hover{color:var(--ink)}
aside button.on{color:var(--ink)}aside button.on:after{content:"";position:absolute;right:-1px;top:20%;bottom:20%;width:3px;background:var(--mp-accent)}
aside .tools{margin-top:auto;display:grid;gap:2px}aside .tools button{writing-mode:horizontal-tb;padding:5px 7px;font-size:16px;letter-spacing:0}aside .tools button .mp-ico{display:inline-block}aside .tools button span{display:none}
aside .back{margin-top:6px;font-size:11px}
main{position:relative;min-height:0}
.now{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
.left{position:relative;display:grid;place-items:center}
.enso{width:min(38vw,56vh);aspect-ratio:1;position:relative;display:grid;place-items:center}
.enso .moon{width:44%;aspect-ratio:1;border-radius:50%;background-size:cover;filter:grayscale(.75) contrast(1.1) sepia(.25);opacity:.85;-webkit-mask:radial-gradient(circle,#000 55%,transparent 72%);mask:radial-gradient(circle,#000 55%,transparent 72%)}
.seal{position:absolute;right:6%;bottom:10%;width:46px;height:46px;background:var(--mp-accent);color:#f6e9d8;font-size:17px;line-height:23px;text-align:center;border-radius:4px;rotate:-4deg;opacity:.9;font-weight:700}
.ttl{position:absolute;left:8%;top:9%;writing-mode:vertical-rl;letter-spacing:.3em}
.ttl b{font-size:clamp(30px,3.6vw,52px);font-weight:400}.ttl>span{display:block;font-size:14px;color:var(--mp-sub);margin-right:10px;letter-spacing:.2em}
.lyr{height:min(64vh,560px);align-self:center;margin-right:6vw;writing-mode:vertical-rl;font-size:clamp(20px,2vw,28px);letter-spacing:.24em}
.mp-ly-inner{height:100%}
.mp-ly-line{padding:0 .62em;color:#1f1c1838;height:100%;transition:color .8s}
.mp-ly-line.on{color:var(--ink)}
.mp-ly-line.on span{background:linear-gradient(180deg,var(--ink) calc(var(--lp,0)*100%),#1f1c1866 calc(var(--lp,0)*100% + 10%));-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{grid-column:1/-1;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:18px;align-items:center;padding:14px 5vw 22px}
.ctrl{display:flex;gap:14px;align-items:center}.ctrl button{background:none;border:0;font-size:17px;color:var(--mp-sub)}.ctrl button:hover,.ctrl button.on{color:var(--ink)}
.ctrl .pp{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:18px}
.line{height:1px;background:var(--ink);opacity:.9;position:relative}
.line:before{content:"";position:absolute;left:0;top:-1.5px;height:4px;width:calc(var(--p,0)*100%);background:var(--ink);border-radius:2px}
.line:after{content:"";position:absolute;left:calc(var(--p,0)*100% - 6px);top:-6px;width:12px;height:12px;border-radius:50%;background:var(--mp-accent)}
.bar span{font-size:13px;color:var(--mp-sub);font-variant-numeric:tabular-nums}.line.v{width:80px}
main>.lib{position:absolute;inset:0;background:#f1ece0e6}.lib>header h2{font-weight:400;letter-spacing:.2em}
.mp-poster{filter:saturate(.55) sepia(.2);box-shadow:none;border:1px solid var(--mp-line)}.mp-btn{border-radius:2px;background:var(--ink);color:var(--paper)}
body.oled-black{--ink:#e6dfd0;--paper:#000;--mp-text:#e6dfd0;--mp-sub:#8b8577;--mp-panel:rgba(12,12,11,.96);--mp-panel2:rgba(255,245,225,.06);--mp-line:rgba(255,245,225,.13);color:#e6dfd0}
body.oled-black .mp-ly-line{color:#e6dfd038}body.oled-black .mp-ly-line.on span{background-image:linear-gradient(180deg,#e6dfd0 calc(var(--lp,0)*100%),#e6dfd066 calc(var(--lp,0)*100% + 10%))}
body.oled-black main>.lib{background:#000000e6}
body.immersive .ui{grid-template-columns:minmax(0,1fr)}body.immersive aside{display:none}body.immersive .lyr{font-size:clamp(24px,2.6vw,36px)}
@media(max-width:900px){.now{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr) auto}.lyr{margin:0 6vw;height:100%}.enso{width:min(70vw,34vh)}.bar{grid-template-columns:auto minmax(0,1fr) auto}.bar .line.v,.bar>span:first-of-type{display:none}.bar{grid-column:1}}
</style></head><body>
<canvas id="fx"></canvas>
<div class="ui">
<aside data-static data-autohide><h1>水墨</h1><!--NAV--><div class="tools"><!--TOOLS--></div><a class="back" href="index.html">← 返回</a></aside>
<main>
  <section data-view="now" class="now on">
    <div class="left"><div class="ttl" data-drift><b data-mp="title"></b><span><span data-mp="artist"></span>　<span data-mp="album"></span></span></div>
      <div class="enso" id="enso" data-drift><div class="moon" data-mp="cover" id="moon"></div><div class="seal">听<br>松</div></div></div>
    <div class="lyr" data-mp="lyrics" data-axis="x" data-drift></div>
    <div class="bar" data-autohide><div class="ctrl"><!--CTRL--></div><span data-mp="cur"></span><div class="line" data-mp="progress"></div><span data-mp="dur"></span><div class="line v" data-mp="vol"></div></div>
  </section>
  <!--VIEWS-->
</main>
</div>
<script>/*CORE_JS*/</script>
<script>
const enso=document.getElementById('enso');MP.spin(document.getElementById('moon'),3);
let rot=0,rv=0,lastLv=0;const drops=[];
MP.canvas(document.getElementById('fx'),(g,w,h,t,dt)=>{
  const dark=document.body.classList.contains('oled-black'),ink=dark?'230,223,208':'31,28,24',lv=MP.level(),now=document.body.dataset.view==='now';
  g.clearRect(0,0,w,h);
  // 远山：几层淡墨，缓缓横移
  if(!dark)for(let l=0;l<4;l++){g.fillStyle=`rgba(${ink},${.035+l*.03})`;g.beginPath();g.moveTo(0,h);
    for(let x=0;x<=w;x+=16){const k=x*.0016*(l+1)+t*.012*(l+1)+l*7;g.lineTo(x,h*(.74+l*.06)-Math.abs(Math.sin(k)*Math.sin(k*.37+1))*h*(.2-l*.035))}g.lineTo(w,h);g.fill()}
  if(!now)return;
  const r=enso.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=r.width*.4;
  // 鼓点处滴一滴墨，向外晕开
  if(lv-lastLv>.06&&MP.state.playing&&drops.length<14)drops.push({a:Math.random()*6.28,d:R*(1.15+Math.random()*.5),t:0,s:6+Math.random()*16});lastLv=lv;
  for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.t+=dt;const p=d.t/3.2;if(p>=1){drops.splice(i,1);continue}
    g.fillStyle=`rgba(${ink},${(1-p)*.16})`;g.beginPath();g.arc(cx+Math.cos(d.a)*d.d,cy+Math.sin(d.a)*d.d,d.s*(.4+p*2.4),0,7);g.fill()}
  // 墨圈：一笔画成，起笔浓、收笔枯，随音乐呼吸并缓慢旋转
  rv+=((MP.state.playing?.5:.04)-rv)*Math.min(1,dt*2);rot+=rv*dt;
  const N=220,gap=.5,s=MP.spectrum(32);
  for(let i=0;i<N;i++){const p=i/N,a=rot+p*(Math.PI*2-gap),wd=R*.13*(Math.pow(1-p,.7)*.85+.15)*(1+lv*.25),rr=R*(1+Math.sin(p*9+t*.6)*.012+s[(p*31)|0]*.07);
    const dry=p>.72?(Math.sin(i*12.9898)*43758.5453%1+1)%1:1;if(p>.72&&dry<(p-.72)*2.6)continue;
    g.fillStyle=`rgba(${ink},${.9-p*.5})`;g.beginPath();g.ellipse(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,wd*.55,wd*.5,a,0,7);g.fill()}
});
</script></body></html>
