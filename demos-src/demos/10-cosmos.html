<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>10 星河壁纸 · 界面 demo</title>
<style>/*CORE_CSS*/
/* ===== 10 星河壁纸：原创设计，为“挂在桌面当动态壁纸”而生 ===== */
:root{--mp-accent:hsl(var(--hue,220) 90% 72%);--mp-accent2:hsl(calc(var(--hue,220) + 80) 90% 72%);--mp-bg:#000;--mp-panel:rgba(14,16,26,.82);--mp-radius:18px}
body{background:#000}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.clock{position:fixed;left:4vw;top:5vh;z-index:2;font-weight:200;letter-spacing:.02em}
.clock b{display:block;font-size:clamp(46px,6.4vw,104px);font-weight:200;line-height:1;font-variant-numeric:tabular-nums}
.clock span{font-size:14px;color:#ffffff9c;letter-spacing:.2em}
.tr{position:fixed;right:4vw;top:5vh;z-index:2;text-align:right}
.tr b{display:block;font-size:20px;font-weight:600}.tr span{font-size:13px;color:#ffffff9c}
.tr i{display:inline-block;width:44px;height:44px;border-radius:50%;background-size:cover;margin-bottom:10px;box-shadow:0 0 0 2px #ffffff30}
.lyw{position:fixed;left:0;right:0;bottom:15vh;z-index:2;display:grid;place-items:center;pointer-events:none}
.lyr{width:min(90vw,1100px);height:8.4em;font-size:clamp(18px,2.1vw,30px);text-align:center;pointer-events:auto;line-height:1.5}
.mp-ly-line{padding:.38em 0;color:#ffffff38;transition:all .7s}
.mp-ly-line.on{color:#fff;font-size:1.5em;font-weight:600;text-shadow:0 0 24px hsl(var(--hue) 90% 70%/.9);letter-spacing:.06em}
.dock{position:fixed;left:50%;bottom:22px;translate:-50% 0;z-index:5;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:22px;background:#ffffff14;backdrop-filter:blur(26px) saturate(1.4);border:1px solid #ffffff22;max-width:96vw}
.dock button{background:none;border:0;width:40px;height:40px;border-radius:12px;font-size:17px;display:grid;place-items:center;position:relative;transition:.18s;flex:none}
.dock button:hover{background:#ffffff1f;transform:translateY(-4px) scale(1.12)}
.dock button.on{color:var(--mp-accent)}.dock button.on:after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;border-radius:50%;background:currentColor;translate:-50% 0}
.dock button span{position:absolute;bottom:calc(100% + 10px);left:50%;translate:-50% 0;white-space:nowrap;font-size:12px;background:#000c;padding:4px 9px;border-radius:7px;opacity:0;pointer-events:none;transition:.15s}
.dock button:hover span{opacity:1}
.dock .pp{background:#fff;color:#000;border-radius:50%;width:46px;height:46px;font-size:20px}.dock .pp:hover{background:#fff}
.dock u{width:1px;height:26px;background:#ffffff26;margin:0 6px;flex:none}
.dock .line{width:min(18vw,220px);height:4px;border-radius:4px;background:#ffffff2e;position:relative;margin:0 8px;flex:none}
.dock .line:before{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--p,0)*100%);background:linear-gradient(90deg,var(--mp-accent),var(--mp-accent2));border-radius:4px}
.dock em{font-style:normal;font-size:12px;color:#ffffffa0;font-variant-numeric:tabular-nums;flex:none}
main{position:fixed;inset:0;z-index:3;pointer-events:none}
main>.lib{pointer-events:auto;position:absolute;inset:4vh 4vw 96px;height:auto;border-radius:24px;background:#0c0e18cc;backdrop-filter:blur(30px);border:1px solid #ffffff1a;animation:mp-pop .4s cubic-bezier(.2,.8,.2,1)}
body:not([data-view="now"]) .lyw,body:not([data-view="now"]) .clock,body:not([data-view="now"]) .tr{opacity:0;transition:opacity .4s}
.back{position:fixed;right:4vw;bottom:34px;z-index:5}
body.immersive .back{display:none}
@media(max-width:1000px){.dock{gap:0;padding:6px;overflow-x:auto}.dock .line,.dock em,.back{display:none}.tr{display:none}}
</style></head><body>
<canvas id="fx"></canvas>
<div class="clock" data-drift><b id="ck">00:00</b><span id="dt"></span></div>
<div class="tr" data-drift><i data-mp="cover" id="av"></i><b data-mp="title"></b><span><span data-mp="artist"></span> · <span data-mp="fmt"></span></span></div>
<div class="lyw"><div class="lyr" data-mp="lyrics" data-pos=".5" data-drift></div></div>
<main><section data-view="now" class="on"></section><!--VIEWS--></main>
<div class="dock" data-autohide><!--NAV--><u></u><!--CTRL--><em data-mp="cur"></em><div class="line" data-mp="progress"></div><em data-mp="dur"></em><u></u><!--TOOLS--></div>
<a class="back" href="index.html" data-autohide>全部风格</a>
<script>/*CORE_JS*/</script>
<script>
MP.spin(document.getElementById('av'),12);
const ck=document.getElementById('ck'),dtE=document.getElementById('dt');
const tick=()=>{const d=new Date();ck.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');dtE.textContent=`${d.getMonth()+1} 月 ${d.getDate()} 日 · 星期${'日一二三四五六'[d.getDay()]}`};tick();setInterval(tick,5000);
// 星系：四条旋臂上的粒子，转速和亮度跟随音乐
const N=3600,P=Array.from({length:N},(_,i)=>{const arm=i%4,r=Math.pow(Math.random(),.62);return{r,a:arm*Math.PI/2+r*5.2+(Math.random()-.5)*(.55+r*.5),z:(Math.random()-.5)*.12*(1-r),s:.5+Math.random()*1.7,b:(Math.random()*32)|0,h:Math.random()}});
const bg=Array.from({length:220},()=>[Math.random(),Math.random(),Math.random()]);let rot=0,rv=.02;
MP.canvas(document.getElementById('fx'),(g,w,h,t,dt)=>{
  const s=MP.spectrum(32),lv=MP.level(),hue=MP.cur().hue,cx=w/2,cy=h*.38,R=Math.min(w,h)*.5,tilt=.42;
  rv+=((MP.state.playing?.11:.018)-rv)*Math.min(1,dt*1.5);rot+=rv*dt*(1+lv*.8);
  g.globalCompositeOperation='source-over';g.fillStyle='#000';g.fillRect(0,0,w,h);
  bg.forEach(b=>{g.globalAlpha=.25+.5*Math.abs(Math.sin(t*b[2]+b[0]*20));g.fillStyle='#fff';g.fillRect(b[0]*w,b[1]*h,1.2,1.2)});
  g.globalCompositeOperation='lighter';g.globalAlpha=1;
  const core=g.createRadialGradient(cx,cy,0,cx,cy,R*(.32+lv*.12));core.addColorStop(0,`hsl(${hue+30} 100% 88%/.75)`);core.addColorStop(.3,`hsl(${hue} 90% 60%/.28)`);core.addColorStop(1,'transparent');g.fillStyle=core;g.fillRect(0,0,w,h);
  for(let i=0;i<N;i++){const p=P[i],v=s[p.b],rr=p.r*R*(1+v*.1),a=p.a+rot*(1.5-p.r*.9),x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr*tilt+p.z*R-v*p.r*22;
    g.fillStyle=`hsl(${hue+p.h*90-20+p.r*40} 90% ${62+v*30}%/${.5+v*.5})`;const sz=p.s*(1.15+v*1.6);g.fillRect(x-sz/2,y-sz/2,sz,sz)}
  g.globalCompositeOperation='source-over';
});
</script></body></html>
