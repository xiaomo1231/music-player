<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>05 云母 · 界面 demo</title>
<style>/* ===== 公共内核样式：所有 demo 共享，用 CSS 变量换皮 ===== */
:root{
  --mp-bg:#0e0f13; --mp-panel:rgba(24,25,32,.92); --mp-panel2:rgba(255,255,255,.06);
  --mp-text:#eef0f5; --mp-sub:#9aa0ad; --mp-accent:#7aa2ff; --mp-accent2:#b38cff;
  --mp-line:rgba(255,255,255,.1); --mp-radius:14px; --mp-font:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
  --mp-blur:24px; --mp-shadow:0 20px 60px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--mp-font);color:var(--mp-text);background:var(--mp-bg);overflow:hidden;transition:translate 2.5s ease}
button{font:inherit;color:inherit;cursor:pointer}
.mp-ico{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.2em;flex:none}
[data-mp="progress"],[data-mp="vol"]{cursor:pointer;touch-action:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--mp-line);border-radius:8px}

/* 歌词 */
[data-mp="lyrics"]{position:relative;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 22%,#000 78%,transparent)}
[data-mp="lyrics"][data-axis="x"]{-webkit-mask-image:linear-gradient(to left,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(to left,transparent,#000 18%,#000 82%,transparent)}
.mp-ly-inner{transition:transform .75s cubic-bezier(.2,.8,.2,1);will-change:transform}
.mp-ly-line{transition:color .4s,opacity .4s,transform .5s,filter .5s;cursor:pointer}
.mp-ly-empty{opacity:.5;padding:2em 0;text-align:center}

/* 通用列表/网格（各 demo 可覆盖） */
.mp-row{display:grid;grid-template-columns:2.2em 2.6em 1fr 1fr 6em 3.5em;gap:12px;align-items:center;padding:7px 10px;border-radius:calc(var(--mp-radius)*.6);cursor:pointer;font-size:13.5px}
.mp-row:hover{background:var(--mp-panel2)}
.mp-row.on{color:var(--mp-accent)}
.mp-row .mp-n,.mp-row .mp-d,.mp-row .mp-al{color:var(--mp-sub);font-variant-numeric:tabular-nums}
.mp-row .mp-cover{width:2.6em;height:2.6em;border-radius:calc(var(--mp-radius)*.4)}
.mp-row .mp-t{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-row .mp-t small{display:block;color:var(--mp-sub);font-size:12px}
.mp-fmt{font-size:10.5px;letter-spacing:.04em;border:1px solid var(--mp-line);border-radius:5px;padding:2px 6px;color:var(--mp-sub);justify-self:start;white-space:nowrap}
.mp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.mp-card{cursor:pointer;min-width:0}
.mp-poster{aspect-ratio:2/3;border-radius:var(--mp-radius);position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:transform .35s,box-shadow .35s}
.mp-grid.wide .mp-poster{aspect-ratio:16/9}
.mp-card:hover .mp-poster{transform:translateY(-4px) scale(1.02);box-shadow:0 16px 36px rgba(0,0,0,.45)}
.mp-poster .mp-badge{position:absolute;left:8px;top:8px;font-size:10px;padding:2px 6px;border-radius:5px;background:rgba(0,0,0,.55);color:#fff;letter-spacing:.04em}
.mp-poster .mp-pt{position:absolute;inset:auto 10px 10px 10px;font-weight:700;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);font-size:15px;line-height:1.25}
.mp-poster .mp-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--mp-accent)}
.mp-card-t{margin-top:8px;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-card-s{font-size:12px;color:var(--mp-sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-book .mp-poster{aspect-ratio:3/4.2;border-radius:4px 10px 10px 4px}
.mp-book .mp-poster:before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent)}
.mp-book .mp-pt{writing-mode:vertical-rl;inset:14px 14px auto auto;font-size:17px;letter-spacing:.15em}

/* 格式转换 */
.mp-conv{display:grid;gap:16px}
.mp-drop{border:1.5px dashed var(--mp-line);border-radius:var(--mp-radius);padding:26px;text-align:center;color:var(--mp-sub);transition:.3s}
.mp-drop:hover{border-color:var(--mp-accent);color:var(--mp-text)}
.mp-drop b{display:block;color:var(--mp-text);font-size:16px;margin-bottom:4px}
.mp-chips{display:flex;flex-wrap:wrap;gap:8px}
.mp-chip{border:1px solid var(--mp-line);background:var(--mp-panel2);padding:6px 12px;border-radius:999px;font-size:12.5px}
.mp-chip.on{border-color:var(--mp-accent);color:var(--mp-accent)}
.mp-q{display:grid;gap:8px}
.mp-qi{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 12px;border-radius:calc(var(--mp-radius)*.7);background:var(--mp-panel2);font-size:13px}
.mp-qi small{color:var(--mp-sub)}
.mp-qi .mp-pb{grid-column:1/-1;height:4px;border-radius:4px;background:var(--mp-line);overflow:hidden}
.mp-qi .mp-pb i{display:block;height:100%;width:calc(var(--p,0)*100%);background:linear-gradient(90deg,var(--mp-accent),var(--mp-accent2));transition:width .2s}
.mp-plugin{padding:12px 14px;border-radius:var(--mp-radius);border:1px solid var(--mp-line);font-size:12.5px;color:var(--mp-sub);display:flex;gap:12px;align-items:flex-start}
.mp-btn{background:var(--mp-accent);color:#fff;border:0;border-radius:999px;padding:9px 20px;font-weight:600}
.mp-btn.ghost{background:transparent;border:1px solid var(--mp-line);color:var(--mp-text)}

/* 开关 */
.mp-sw{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:22px;background:var(--mp-line);position:relative;cursor:pointer;transition:.25s;flex:none;margin:0}
.mp-sw:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.25s}
.mp-sw:checked{background:var(--mp-accent)}.mp-sw:checked:after{left:19px}

/* 抽屉/弹窗 */
.mp-modal{position:fixed;inset:0;z-index:900;display:grid;place-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s}
.mp-modal.open{opacity:1;pointer-events:auto}
.mp-sheet{width:min(560px,92vw);max-height:86vh;overflow:auto;background:var(--mp-panel);backdrop-filter:blur(var(--mp-blur));color:var(--mp-text);border:1px solid var(--mp-line);border-radius:calc(var(--mp-radius)*1.3);box-shadow:var(--mp-shadow);padding:22px 24px;transform:translateY(16px) scale(.98);transition:transform .35s cubic-bezier(.2,.8,.2,1);font-family:var(--mp-font)}
.mp-modal.open .mp-sheet{transform:none}
.mp-sheet h3{margin:0 0 4px;font-size:19px;display:flex;align-items:center;gap:10px}
.mp-sheet h3 .mp-x{margin-left:auto;background:none;border:0;opacity:.6;font-size:20px}
.mp-sheet .mp-desc{color:var(--mp-sub);font-size:13px;margin:0 0 14px;line-height:1.6}
.mp-opt{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--mp-line);font-size:14px}
.mp-opt>div{flex:1}.mp-opt small{display:block;color:var(--mp-sub);font-size:12px;margin-top:2px;line-height:1.5}
.mp-opt select,.mp-sheet textarea{background:var(--mp-panel2);color:var(--mp-text);border:1px solid var(--mp-line);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px}
.mp-opt select option{background:#222;color:#eee}
.mp-sheet textarea{width:100%;height:88px;resize:vertical;font-family:Consolas,monospace;font-size:12px}

/* 扫描 */
.mp-drives{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin:10px 0 6px}
.mp-drive{border:1px solid var(--mp-line);border-radius:12px;padding:10px 12px;text-align:left;background:var(--mp-panel2);font-size:13px;transition:.2s}
.mp-drive small{display:block;color:var(--mp-sub);font-size:11px;margin-top:3px}
.mp-drive .mp-dbar{height:4px;border-radius:4px;background:var(--mp-line);margin-top:7px;overflow:hidden}.mp-drive .mp-dbar i{display:block;height:100%;background:var(--mp-sub)}
.mp-drive.on{border-color:var(--mp-accent);box-shadow:0 0 0 1px var(--mp-accent) inset}.mp-drive.on .mp-dbar i{background:var(--mp-accent)}
.mp-scanmode{display:flex;gap:8px;margin-top:6px}
.mp-scanrun{display:grid;grid-template-columns:170px 1fr;gap:20px;align-items:center}
.mp-radar{width:170px;height:170px;position:relative}
.mp-radar canvas{width:100%;height:100%}
.mp-radar b{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.mp-path{font-family:Consolas,"Cascadia Mono",monospace;font-size:11.5px;color:var(--mp-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:4px 0 12px}
.mp-counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mp-counts div{background:var(--mp-panel2);border-radius:10px;padding:8px;text-align:center;font-size:11.5px;color:var(--mp-sub)}
.mp-counts b{display:block;font-size:20px;color:var(--mp-text);font-variant-numeric:tabular-nums}
.mp-feed{margin-top:14px;display:grid;gap:5px;height:150px;overflow:hidden;font-size:12.5px}
.mp-feed div{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:8px;background:var(--mp-panel2);animation:mp-in .45s cubic-bezier(.2,.8,.2,1)}
.mp-feed div span{color:var(--mp-sub);margin-left:auto;font-size:11px}
@keyframes mp-in{from{opacity:0;transform:translateX(-18px)}}

/* 均衡器 */
.mp-eq{display:flex;justify-content:space-between;gap:6px;height:190px;margin:14px 0 6px}
.mp-eqb{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;font-size:10.5px;color:var(--mp-sub)}
.mp-eqb input{writing-mode:vertical-lr;direction:rtl;flex:1;width:22px;accent-color:var(--mp-accent)}

/* 视频播放器 / 阅读器 */
.mp-over{position:fixed;inset:0;z-index:800;background:#000;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .35s;color:#fff;font-family:var(--mp-font)}
.mp-over.open{opacity:1;pointer-events:auto}
.mp-vstage{flex:1;position:relative;overflow:hidden}
.mp-vstage canvas{width:100%;height:100%;display:block}
.mp-sub{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-size:clamp(16px,2.4vw,30px);text-shadow:0 2px 6px #000,0 0 2px #000;line-height:1.4;pointer-events:none}
.mp-sub small{display:block;font-size:.65em;opacity:.85}
.mp-vbar{position:absolute;left:0;right:0;bottom:0;padding:40px 28px 20px;background:linear-gradient(transparent,rgba(0,0,0,.85));transition:opacity .4s;display:grid;gap:10px}
.mp-vtop{position:absolute;left:0;right:0;top:0;padding:18px 28px 40px;background:linear-gradient(rgba(0,0,0,.7),transparent);display:flex;align-items:center;gap:14px;transition:opacity .4s}
.mp-over.idle .mp-vbar,.mp-over.idle .mp-vtop{opacity:0}
.mp-over.idle{cursor:none}
.mp-vrow{display:flex;align-items:center;gap:14px;font-size:13px}
.mp-vrow button{background:none;border:0;font-size:20px;padding:4px;color:#fff}
.mp-vrow select{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:6px;padding:4px 6px;font:inherit;font-size:12px}
.mp-vrow select option{color:#000}
.mp-tag{font-size:11px;padding:3px 8px;border-radius:5px;background:rgba(255,255,255,.14);letter-spacing:.03em}
.mp-vprog{height:4px;background:rgba(255,255,255,.25);border-radius:4px;position:relative;cursor:pointer}
.mp-vprog i{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p,0)*100%);background:var(--mp-accent);border-radius:4px}
.mp-reader{background:#f3ecdc;color:#2b2418}
.mp-reader.night{background:#111;color:#9c9a94}.mp-reader.green{background:#cfe3cf;color:#1f2d1f}
.mp-rhead{display:flex;align-items:center;gap:12px;padding:14px 26px;font-size:13px;opacity:.8}
.mp-rhead button{background:none;border:1px solid currentColor;border-radius:8px;padding:3px 10px;font-size:12px;opacity:.75}
.mp-rbody{flex:1;overflow:auto;padding:10px max(26px,calc(50vw - 380px)) 60px}
.mp-rbody h2{font-weight:600;letter-spacing:.06em}
.mp-rbody p{font-size:var(--fs,19px);line-height:2;text-indent:2em;margin:0 0 .6em;font-family:"Songti SC","SimSun","Noto Serif SC",serif}
.mp-rbody p.tts{background:rgba(255,200,0,.22);border-radius:4px}
.mp-rprog{height:3px;background:rgba(0,0,0,.1)}.mp-rprog i{display:block;height:100%;background:#b0864a;width:0}

/* 迷你播放器 */
.mp-mini{position:fixed;right:24px;bottom:24px;z-index:700;width:320px;display:none;grid-template-columns:56px 1fr;gap:4px 12px;align-items:center;padding:12px;border-radius:calc(var(--mp-radius)*1.2);background:var(--mp-panel);backdrop-filter:blur(var(--mp-blur));border:1px solid var(--mp-line);box-shadow:var(--mp-shadow);font-family:var(--mp-font);color:var(--mp-text)}
body.mini .mp-mini{display:grid;animation:mp-pop .4s cubic-bezier(.2,.8,.2,1)}
body.mini>*:not(.mp-mini):not(.mp-modal):not(.mp-dim):not(.mp-toast):not(.mp-refresh){visibility:hidden}
body.mini{background:transparent}
@keyframes mp-pop{from{opacity:0;transform:translateY(20px) scale(.95)}}
.mp-mini .mp-mc{width:56px;height:56px;border-radius:10px;grid-row:span 3;animation:mp-spin 14s linear infinite;animation-play-state:paused;border-radius:50%}
body.playing .mp-mini .mp-mc{animation-play-state:running}
.mp-mini .mp-mt{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-mini .mp-ml{font-size:12px;color:var(--mp-accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-mini .mp-mb{display:flex;gap:6px}.mp-mini .mp-mb button{background:none;border:0;padding:2px 6px;font-size:16px}
.mp-mini [data-mp="progress"]{grid-column:1/-1;height:3px;border-radius:3px;background:var(--mp-line);position:relative;margin-top:6px}
.mp-mini [data-mp="progress"]:before{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--p,0)*100%);background:var(--mp-accent);border-radius:3px}
@keyframes mp-spin{to{transform:rotate(360deg)}}

/* ===== OLED 防烧屏 ===== */
.mp-dim{position:fixed;inset:-20px;background:#000;opacity:0;pointer-events:none;z-index:1000;transition:opacity 2.5s ease}
body.dimmed .mp-dim{opacity:var(--mp-dim,.65)}
body.oled-black{background:#000 !important;--mp-bg:#000}
body.oled-black .mp-bgfx{opacity:0 !important}
body.oled-static [data-static]{opacity:.5;transition:opacity .6s}
body.oled-static [data-static]:hover{opacity:1}
body.oled-drift [data-drift]{animation:mp-drift 97s ease-in-out infinite alternate}
body.oled-drift [data-drift]:nth-of-type(2n){animation-duration:131s;animation-direction:alternate-reverse}
@keyframes mp-drift{0%{translate:0 0}20%{translate:10px -6px}40%{translate:-8px 9px}60%{translate:7px 12px}80%{translate:-11px -5px}100%{translate:4px -10px}}
body.immersive.idle [data-autohide],body.oled-hide.idle [data-autohide]{opacity:0 !important;pointer-events:none;transition:opacity 1.2s}
[data-autohide]{transition:opacity .4s}
body.immersive.idle{cursor:none}
.mp-refresh{position:fixed;inset:0;z-index:1001;pointer-events:none;display:none}
.mp-refresh.run{display:block;animation:mp-ref 6s linear forwards}
@keyframes mp-ref{0%{background:#f00}16%{background:#0f0}33%{background:#00f}50%{background:#fff}66%{background:#000}100%{background:#000;opacity:0}}
.mp-toast{position:fixed;left:50%;bottom:32px;translate:-50% 0;z-index:1002;background:var(--mp-panel);color:var(--mp-text);border:1px solid var(--mp-line);backdrop-filter:blur(var(--mp-blur));padding:9px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .3s,transform .3s;transform:translateY(10px);pointer-events:none;font-family:var(--mp-font)}
.mp-toast.show{opacity:1;transform:none}
.mp-keys{font-size:12px;color:var(--mp-sub);line-height:1.9}
.mp-keys kbd{border:1px solid var(--mp-line);border-radius:4px;padding:0 5px;font-family:inherit;margin-right:3px}
/* 视图切换与媒体库默认排版 */
[data-view]:not(.on){display:none !important}
.lib{overflow:auto;padding:28px 34px 40px;height:100%}
.lib>header{margin-bottom:18px}
.lib>header h2{margin:0;font-size:28px;letter-spacing:.01em}
.lib>header p{margin:6px 0 0;color:var(--mp-sub);font-size:13px}
.lib .mp-conv{max-width:820px}
.back{color:inherit;text-decoration:none;opacity:.6;font-size:12.5px}.back:hover{opacity:1}

/* ===== 05 云母：参考 Windows 11 Fluent 的浅色云母材质，带唱臂的转盘 ===== */
:root{--mp-accent:#0067c0;--mp-accent2:#4cc2ff;--mp-bg:#f3f3f3;--mp-panel:rgba(249,249,249,.92);--mp-panel2:rgba(0,0,0,.045);--mp-text:#1b1b1b;--mp-sub:#5f5f5f;--mp-line:rgba(0,0,0,.09);--mp-radius:8px;--mp-shadow:0 16px 48px rgba(0,0,0,.18);--card:#ffffffb8;--tint:hsl(var(--hue,200) 70% 92%)}
body{background:linear-gradient(135deg,var(--tint),#f3f3f3 45%,hsl(calc(var(--hue,200) + 60) 60% 93%));transition:background 1s,translate 2.5s;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:32px minmax(0,1fr) auto}
.title{grid-column:1/-1;display:flex;align-items:center;font-size:12px;padding-left:14px;color:var(--mp-sub)}
.title span{flex:1}.title i{width:46px;height:32px;display:grid;place-items:center;font-style:normal;font-size:10px}.title i:last-child:hover{background:#c42b1c;color:#fff}
aside{width:232px;padding:4px 6px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
aside button{display:flex;gap:14px;align-items:center;background:none;border:0;padding:9px 12px;border-radius:5px;font-size:13.5px;text-align:left;position:relative}
aside button:hover{background:#0000000d}aside button.on{background:#00000010}
aside button.on:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--mp-accent)}
aside hr{border:0;border-top:1px solid var(--mp-line);margin:8px 4px;width:calc(100% - 8px)}
aside .back{margin:auto 12px 0}
main{background:var(--card);border:1px solid #0000000f;border-radius:8px 0 0 0;min-height:0;position:relative;overflow:hidden}
.now{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:3vw;padding:3vh 4vw}
.tt{position:relative;width:min(100%,56vh,460px);aspect-ratio:1.12;justify-self:center;border-radius:14px;background:linear-gradient(160deg,#fff,#ececec);box-shadow:0 2px 4px #0001,0 18px 40px #0000001f;border:1px solid #0000000d}
.plat{position:absolute;left:6%;top:8%;width:75%;aspect-ratio:1;border-radius:50%;background:#d9d9d9;box-shadow:inset 0 2px 8px #0003}
.rec{position:absolute;inset:3%;border-radius:50%;background:repeating-radial-gradient(circle,#232323 0 1.5px,#161616 2px 3.5px);box-shadow:0 4px 14px #0005}
.rec:before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,transparent 0 10%,#ffffff26 16%,transparent 24% 60%,#ffffff1c 66%,transparent 74%)}
.rec i{position:absolute;inset:30%;border-radius:50%;background-size:cover}.rec i:after{content:"";position:absolute;inset:45%;border-radius:50%;background:#eee}
.arm{position:absolute;right:9%;top:7%;width:7%;height:62%;transform-origin:50% 9%;transform:rotate(-24deg);transition:transform 1.1s cubic-bezier(.3,1.2,.4,1)}
.arm:before{content:"";position:absolute;left:50%;top:0;width:260%;aspect-ratio:1;translate:-50% 0;border-radius:50%;background:radial-gradient(circle,#fafafa 0 30%,#c8c8c8 32% 100%);box-shadow:0 2px 6px #0004}
.arm:after{content:"";position:absolute;left:50%;top:9%;bottom:8%;width:22%;translate:-50% 0;background:linear-gradient(90deg,#bbb,#f4f4f4,#aaa);border-radius:4px}
.arm b{position:absolute;left:50%;bottom:0;width:120%;height:16%;translate:-50% 0;rotate:18deg;border-radius:3px;background:var(--mp-accent);z-index:2}
.knob{position:absolute;right:8%;bottom:8%;display:flex;gap:10px;align-items:center;font-size:10.5px;color:var(--mp-sub)}
.knob u{width:9px;height:9px;border-radius:50%;background:#bbb;text-decoration:none;transition:.3s}body.playing .knob u{background:#22c55e;box-shadow:0 0 8px #22c55e}
.rt{display:grid;grid-template-rows:auto minmax(0,1fr);height:min(72vh,620px)}

/* ---------- 音频引擎：合成器 + 分析器（没有任何音频文件，声音由 WebAudio 实时合成） ---------- */
const A={ctx:null,an:null,master:null,eq:[],fbuf:null,tbuf:null,step:0,nextT:0,el:null,elSrc:null};
const EQF=[31,62,125,250,500,1000,2000,4000,8000,16000];
let eqGains=store.get('eq',EQF.map(()=>0));
function ensureAudio(){
 if(A.ctx) return true;
 try{
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return false;
  const c=A.ctx=new C();
  A.in=c.createGain(); let node=A.in;
  A.eq=EQF.map((f,i)=>{const b=c.createBiquadFilter();b.type=i==0?'lowshelf':i==9?'highshelf':'peaking';b.frequency.value=f;b.Q.value=1.1;b.gain.value=eqGains[i];node.connect(b);node=b;return b});
  A.master=c.createGain();A.master.gain.value=S.vol*.5;node.connect(A.master);
  const comp=c.createDynamicsCompressor();A.master.connect(comp);
  A.an=c.createAnalyser();A.an.fftSize=2048;A.an.smoothingTimeConstant=.78;comp.connect(A.an);A.an.connect(c.destination);
  A.fbuf=new Uint8Array(A.an.frequencyBinCount);A.tbuf=new Uint8Array(A.an.fftSize);
  // 混响感：简单反馈延迟
  A.dly=c.createDelay(1);A.dly.delayTime.value=.33;const fb=c.createGain();fb.gain.value=.32;const wet=c.createGain();wet.gain.value=.28;
  A.send=c.createGain();A.send.connect(A.dly);A.dly.connect(fb);fb.connect(A.dly);A.dly.connect(wet);wet.connect(A.in);
  const nb=c.createBuffer(1,c.sampleRate*.2,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;A.noise=nb;
  return true;
 }catch(e){return false}
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
const SCALE=[0,2,4,7,9,12,14,16,19,21];
function chord(s,bar){const deg=s.prog[bar%s.prog.length];const maj=[0,2,4,5,7,9,11];const r=s.root+maj[deg%7];const minor=[1,2,5].includes(deg%7);return {r,notes:[r,r+(minor?3:4),r+7,r+(minor?10:11)]}}
function voice(type,f,t,dur,g,o={}){
 const c=A.ctx,osc=c.createOscillator(),gn=c.createGain();osc.type=type;osc.frequency.setValueAtTime(f,t);
 if(o.drop) osc.frequency.exponentialRampToValueAtTime(o.drop,t+dur*.6);
 if(o.detune) osc.detune.value=o.detune;
 gn.gain.setValueAtTime(0.0001,t);gn.gain.linearRampToValueAtTime(g,t+(o.att||.01));gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 let out=gn; if(o.lp){const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=o.lp;gn.connect(lp);out=lp}
 osc.connect(gn);out.connect(A.in);if(o.send)out.connect(A.send);osc.start(t);osc.stop(t+dur+.05);
}
function hat(t,g){const c=A.ctx,src=c.createBufferSource();src.buffer=A.noise;const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=7000;const gn=c.createGain();gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.0001,t+.07);src.connect(hp);hp.connect(gn);gn.connect(A.in);src.start(t);src.stop(t+.1)}
function schedule(){
 if(!S.playing||!A.ctx||S.file) return;
 const s=songs[S.idx],c=A.ctx,spb=60/(s.bpm*S.speed)/2; // 八分音符
 if(A.nextT<c.currentTime) A.nextT=c.currentTime+.03;
 while(A.nextT<c.currentTime+.14){
  const st=A.step,bar=(st/8)|0,ch=chord(s,bar),t=A.nextT,fast=s.bpm>100;
  if(st%8==0){ch.notes.forEach((n,i)=>{voice('sawtooth',mtof(n),t,spb*8.2,.05,{att:.5,lp:1100,detune:i%2?7:-7});});voice('sine',mtof(ch.r-12),t,spb*7,.2,{att:.02})}
  if(st%4==0||(fast&&st%8==6)) voice('sine',120,t,.28,.5,{drop:42});
  if(st%2==1||fast) hat(t,st%4==2?.09:.045);
  if(st%8==4&&fast){const c2=A.ctx,src=c2.createBufferSource();src.buffer=A.noise;const bp=c2.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800;const gn=c2.createGain();gn.gain.setValueAtTime(.22,t);gn.gain.exponentialRampToValueAtTime(.0001,t+.16);src.connect(bp);bp.connect(gn);gn.connect(A.in);src.start(t);src.stop(t+.2)}
  const pat=[0,2,1,3,2,4,3,1],n=ch.notes[pat[(st+bar)%8]%4]+12+((st*7+s.id*3)%5==0?12:0);
  if((st+s.id)%8!=3) voice(s.id%2?'triangle':'square',mtof(n),t,spb*1.8,s.id%2?.13:.05,{att:.005,lp:2600,send:true});
  if(st%16==8) voice('triangle',mtof(ch.r+SCALE[(bar*3+s.id)%10]+12),t,spb*6,.1,{att:.05,send:true});
  A.step++;A.nextT+=spb;
 }
}
setInterval(schedule,25);

let simPh=Math.random()*10;const sm=[];
function spectrum(n=48){
 const out=new Array(n);
 if(A.an&&S.playing&&A.ctx.state==='running'){
  A.an.getByteFrequencyData(A.fbuf);const N=A.fbuf.length,lo=2,hi=N*.62;
  for(let i=0;i<n;i++){const a=lo*Math.pow(hi/lo,i/n),b=lo*Math.pow(hi/lo,(i+1)/n);let m=0,k=0;for(let j=a|0;j<=(b|0)&&j<N;j++){m+=A.fbuf[j];k++}
   out[i]=clamp(Math.pow((m/k)/255,1.25)*(1+i/n*1.1))}
 }else{
  simPh+=.016;const pl=S.playing?1:.16;
  for(let i=0;i<n;i++){const x=i/n;out[i]=clamp(pl*(.42*(1-x*.6)*(.55+.45*Math.sin(simPh*3.1+i*.9)*Math.sin(simPh*1.7+i*.31))+.25*Math.max(0,Math.sin(simPh*8-x*5))*(1-x))+.02)}
 }
 for(let i=0;i<n;i++){sm[i]=sm[i]==null?out[i]:(out[i]>sm[i]?out[i]:sm[i]*.9+out[i]*.1);out[i]=sm[i]}
 return out;
}
function waveform(n=128){
 const out=new Array(n);
 if(A.an&&S.playing&&A.ctx.state==='running'){A.an.getByteTimeDomainData(A.tbuf);const st=A.tbuf.length/n|0;for(let i=0;i<n;i++)out[i]=(A.tbuf[i*st]-128)/128*2.2}
 else{const pl=S.playing?.5:.06,t=performance.now()/1000;for(let i=0;i<n;i++)out[i]=pl*(Math.sin(i*.21+t*5)*.6+Math.sin(i*.07-t*3)*.4)*Math.sin(i/n*Math.PI)}
 return out;
}
let lvl=0;function level(){const s=spectrum(16);const v=(s[0]+s[1]+s[2]+s[3])/4;lvl=v>lvl?v:lvl*.92+v*.08;return lvl}

/* ---------- 播放控制 ---------- */
function setTrack(i,auto){
 if(S.file){try{A.el.pause()}catch(e){}S.file=null}
 S.idx=(i+songs.length)%songs.length;S.t=0;S.dur=songs[S.idx].dur;S.ly=-1;A.step=0;A.nextT=0;
 renderLyrics();syncMeta();emit('track',cur());if(auto)play();
}
function play(){
 ensureAudio();if(A.ctx&&A.ctx.state!=='running')A.ctx.resume();
 S.playing=true;document.body.classList.add('playing');if(S.file&&A.el)A.el.play();syncMeta();emit('play');
}
function pause(){S.playing=false;document.body.classList.remove('playing');if(S.file&&A.el)A.el.pause();syncMeta();emit('pause')}
const toggle=()=>S.playing?pause():play();
function next(a=true){if(S.shuffle){let j;do{j=Math.random()*songs.length|0}while(j==S.idx);setTrack(j,a)}else setTrack(S.idx+1,a)}
const prev=()=>S.t>4?seek(0):setTrack(S.idx-1,true);
function seek(t){S.t=clamp(t,0,S.dur-.2);if(S.file&&A.el)A.el.currentTime=S.t;S.ly=-2;tickUI(true)}
function setVol(v){S.vol=clamp(v);store.set('vol',S.vol);if(A.master)A.master.gain.value=S.vol*.5;if(A.el)A.el.volume=1;$$('[data-mp="vol"]').forEach(e=>e.style.setProperty('--p',S.vol))}
function setSpeed(v){S.speed=v;if(A.el)A.el.playbackRate=v;toast('播放速度 '+v+'×')}
function lyricIdx(){const l=cur().lrc||[];let k=-1;for(let i=0;i<l.length;i++){if(l[i][0]<=S.t)k=i;else break}return k}
function lyricProgress(){const l=cur().lrc||[],k=lyricIdx();if(k<0)return 0;const a=l[k][0],b=k+1<l.length?l[k+1][0]:S.dur;return clamp((S.t-a)/Math.min(b-a,6))}

/* 打开本地音频（真的可以播放你选的文件，同名 .lrc 会被当作歌词） */
function openFiles(files){
 files=[...files];const au=files.find(f=>/^audio\//.test(f.type)||/\.(mp3|flac|wav|ogg|m4a|opus|aac)$/i.test(f.name));if(!au){toast('没有找到可播放的音频文件');return}
 ensureAudio();if(!A.el){A.el=new Audio();A.el.crossOrigin='anonymous';try{A.elSrc=A.ctx.createMediaElementSource(A.el);A.elSrc.connect(A.in)}catch(e){}
  A.el.addEventListener('loadedmetadata',()=>{S.dur=A.el.duration||0;syncMeta()});A.el.addEventListener('ended',()=>next())}
 const base=au.name.replace(/\.[^.]+$/,'');const m=base.split(' - ');
 S.file={t:m[1]||base,a:m[1]?m[0]:'本地文件',al:'本地导入',fmt:(au.name.split('.').pop()||'').toUpperCase(),hue:(base.length*47)%360,lrc:[],dur:0};
 const lf=files.find(f=>/\.lrc$/i.test(f.name));
 if(lf)lf.text().then(tx=>{S.file.lrc=tx.split(/\r?\n/).map(l=>{const m=l.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)/);return m&&m[3].trim()?[+m[1]*60+ +m[2],m[3].trim()]:null}).filter(Boolean);renderLyrics()});
 A.el.src=URL.createObjectURL(au);S.t=0;S.ly=-1;renderLyrics();syncMeta();emit('track',cur());play();toast('正在播放本地文件：'+au.name);
}

function syncMeta(){

 const map={title:c.t,artist:c.a,album:c.al,fmt:c.fmt,dur:fmtT(S.dur)};
 for(const k in map)$$(`[data-mp="${k}"]`).forEach(e=>e.textContent=map[k]);

 $$('[data-mp="play"]').forEach(e=>{if(!e.hasAttribute('data-keep'))e.innerHTML=icon(S.playing?'pause':'play');e.title=S.playing?'暂停 (空格)':'播放 (空格)'});
 $$('.mp-row[data-i],.mp-qrow[data-i]').forEach(e=>e.classList.toggle('on',!S.file&&+e.dataset.i===S.idx));
 $$('[data-mp="shuffle"]').forEach(e=>e.classList.toggle('on',S.shuffle));

function renderLyrics(){
 const l=cur().lrc||[];
 $$('[data-mp="lyrics"]').forEach(box=>{
  box.innerHTML='<div class="mp-ly-inner">'+(l.length?l.map((x,i)=>`<div class="mp-ly-line" data-k="${i}"><span>${x[1]}</span></div>`).join(''):'<div class="mp-ly-empty">纯音乐 / 暂无歌词</div>')+'</div>';
 });
 S.ly=-2;
}
function placeLyrics(k){
 $$('[data-mp="lyrics"]').forEach(box=>{
  const inner=box.firstElementChild;if(!inner)return;const lines=inner.children;
  for(let i=0;i<lines.length;i++){lines[i].classList.toggle('on',i===k);lines[i].classList.toggle('past',i<k);lines[i].style.setProperty('--d',Math.min(Math.abs(i-k),6))}
  const el=lines[Math.max(k,0)];if(!el||!el.dataset.k)return;
  const pos=parseFloat(box.dataset.pos||'.42');
  const own=el.offsetParent===inner; // inner 自身是定位容器时，偏移量要加上 inner 的原始位置
  if(box.dataset.axis==='x')inner.style.transform=`translateX(${box.clientWidth*.5-(el.offsetLeft+(own?inner.offsetLeft:0)+el.offsetWidth/2)}px)`;
  else inner.style.transform=`translateY(${box.clientHeight*pos-(el.offsetTop+(own?inner.offsetTop:0)+el.offsetHeight/2)}px)`;
 });
 const l=cur().lrc||[];
 $$('[data-mp="lyric-now"]').forEach(e=>e.textContent=k>=0&&l[k]?l[k][1]:'♪');
 $$('[data-mp="lyric-next"]').forEach(e=>e.textContent=l[k+1]?l[k+1][1]:'');
 emit('lyric',k);
}
let lastSec=-1;
function tickUI(force){
 const p=S.dur?S.t/S.dur:0;
 $$('[data-mp="progress"]').forEach(e=>e.style.setProperty('--p',p));
 const sec=S.t|0;if(force||sec!==lastSec){lastSec=sec;$$('[data-mp="cur"]').forEach(e=>e.textContent=fmtT(S.t));$$('[data-mp="remain"]').forEach(e=>e.textContent='-'+fmtT(S.dur-S.t))}
 const k=lyricIdx();if(k!==S.ly){S.ly=k;placeLyrics(k)}
 const lp=lyricProgress();$$('.mp-ly-line.on').forEach(e=>e.style.setProperty('--lp',lp));
}
let lastT=performance.now();
function loop(now){
 const dt=Math.min(.1,(now-lastT)/1000);lastT=now;
 if(S.playing){
  if(S.file&&A.el){S.t=A.el.currentTime}
  else{S.t+=dt*S.speed;if(S.t>=S.dur){if(S.repeat==='one')seek(0);else next()}}
 }
 tickUI();emit('frame',{dt,now});requestAnimationFrame(loop);
}
function dragBind(el,fn){
 const h=e=>{const r=el.getBoundingClientRect();const v=el.dataset.dir==='v'?1-(e.clientY-r.top)/r.height:(e.clientX-r.left)/r.width;fn(clamp(v))};
 el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);h(e);el.onpointermove=h});
 el.addEventListener('pointerup',()=>el.onpointermove=null);
}

const O=Object.assign({black:false,shift:true,shiftSec:60,drift:true,dim:true,dimSec:60,dimLv:.65,hide:true,stat:false},store.get('oled',{}));
let shiftIv,idleT,dimT;
function applyOled(){

/* ---------- 模式 ---------- */
function immersive(v){const b=document.body;const onn=v==null?!b.classList.contains('immersive'):v;b.classList.toggle('immersive',onn);
 try{if(onn&&!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});else if(!onn&&document.fullscreenElement)document.exitFullscreen()}catch(e){}
 if(onn)toast('沉浸模式：按 F 或 Esc 退出，控件会自动隐藏');S.ly=-2;setTimeout(()=>S.ly=-2,500);emit('immersive',onn)}
function mini(v){const b=document.body;const onn=v==null?!b.classList.contains('mini'):v;b.classList.toggle('mini',onn);if(onn)toast('迷你播放器：正式版是一个可置顶的小窗口')}
function setView(v){document.body.dataset.view=v;$$('[data-view]').forEach(e=>e.classList.toggle('on',e.dataset.view===v));$$('[data-nav]').forEach(e=>e.classList.toggle('on',e.dataset.nav===v));S.ly=-2;emit('view',v)}

/* ---------- 初始化 ---------- */
function init(){
 $$('[data-icon]').forEach(e=>e.insertAdjacentHTML('afterbegin',icon(e.dataset.icon)));
 const dim=document.createElement('div');dim.className='mp-dim';document.body.appendChild(dim);
 const mn=document.createElement('div');mn.className='mp-mini';mn.innerHTML=`<div class="mp-mc" data-mp="cover"></div><div class="mp-mt" data-mp="title"></div><div class="mp-ml" data-mp="lyric-now"></div><div class="mp-mb"><button data-mp="prev">${icon('prev')}</button><button data-mp="play"></button><button data-mp="next">${icon('next')}</button><button data-mp="mini" title="还原">${icon('expand')}</button></div><div data-mp="progress"></div>`;document.body.appendChild(mn);
 renderLists();renderLyrics();
 document.addEventListener('click',e=>{
  const t=e.target.closest('[data-mp],[data-nav],.mp-row,.mp-qrow,.mp-card,.mp-ly-line');if(!t)return;
  if(t.dataset.nav)return setView(t.dataset.nav);
  if(t.classList.contains('mp-ly-line')){const l=cur().lrc;if(l[+t.dataset.k]){seek(l[+t.dataset.k][0]);if(!S.playing)play()}return}
  if((t.classList.contains('mp-row')||t.classList.contains('mp-qrow')||(t.classList.contains('mp-card')&&t.dataset.i!=null))&&t.dataset.i!=null)return setTrack(+t.dataset.i,true);
  if(t.dataset.v!=null)return openVideo(videos[+t.dataset.v]);
  if(t.dataset.an!=null){const a=anime[+t.dataset.an];return openVideo({t:a.t+' · 第 '+Math.min(a.seen+1,a.ep)+' 集',fmt:'1080p · HEVC 10bit',hue:a.hue,p:.1})}
  if(t.dataset.nv!=null)return openNovel(novels[+t.dataset.nv]);
  switch(t.dataset.mp){
   case 'play':toggle();break;case 'next':next();break;case 'prev':prev();break;
   case 'shuffle':S.shuffle=!S.shuffle;syncMeta();toast(S.shuffle?'随机播放':'顺序播放');break;
   case 'repeat':S.repeat=S.repeat==='all'?'one':S.repeat==='one'?'off':'all';syncMeta();toast({all:'列表循环',one:'单曲循环',off:'播完停止'}[S.repeat]);break;
   case 'scan-open':openScan();break;case 'oled-open':openOled();break;case 'eq-open':openEq();break;
   case 'immersive':immersive();break;case 'mini':mini();break;
   case 'open-file':{const i=document.createElement('input');i.type='file';i.multiple=true;i.accept='audio/*,.lrc,.flac,.opus';i.onchange=()=>openFiles(i.files);i.click();break}
  }
 });
 $$('[data-mp="progress"]').forEach(e=>dragBind(e,v=>seek(v*S.dur)));
 $$('[data-mp="vol"]').forEach(e=>dragBind(e,setVol));
 document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key.toLowerCase();
  if(k===' '){e.preventDefault();toggle()}else if(k==='arrowright')seek(S.t+5);else if(k==='arrowleft')seek(S.t-5);
  else if(k==='f')immersive();else if(k==='m')mini();else if(k==='o')openOled();else if(k==='s')openScan();else if(k==='e')openEq();
  else if(k==='n')next();else if(k==='p')prev();
  else if(k==='escape'){$$('.mp-modal.open').forEach(m=>m.classList.remove('open'));if(document.body.classList.contains('immersive'))immersive(false)}
 });
 document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('immersive'))immersive(false)});
 ['mousemove','mousedown','keydown','touchstart','wheel'].forEach(ev=>document.addEventListener(ev,wake,{passive:true}));
 window.addEventListener('resize',()=>S.ly=-2);
 document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files.length)openFiles(e.dataTransfer.files)});
 setVol(S.vol);syncMeta();applyOled();
 const v0=(document.querySelector('[data-view].on')||document.querySelector('[data-view]'));if(v0)setView(v0.dataset.view);
 requestAnimationFrame(loop);
 if(!store.get('scanned')&&!/noscan/.test(location.search))setTimeout(openScan,900);
 emit('ready');
}
window.MP={songs,videos,anime,novels,state:S,cur,on,emit,play,pause,toggle,next,prev,seek,setVol,setSpeed,setTrack,spectrum,waveform,level,lyricIdx,lyricProgress,
 coverCSS,icon,fmtT,toast,openScan,openOled,openEq,openVideo,openNovel,immersive,mini,setView,scan:scanSt,oled:O,$,$$,clamp,
 /* 旋转工具：播放时匀速转，暂停时带惯性慢慢停下 */
 spin(el,rpm=8){let a=0,v=0;on('frame',f=>{const tg=S.playing?rpm*6*S.speed:0;v+=(tg-v)*Math.min(1,f.dt*2.2);a=(a+v*f.dt)%360;el.style.transform=`rotate(${a}deg)`})},
 /* 画布工具：自动适配 DPR 与尺寸 */
 canvas(el,draw){const g=el.getContext('2d');let w=0,h=0;const rs=()=>{const d=Math.min(2,devicePixelRatio||1);w=el.clientWidth;h=el.clientHeight;el.width=w*d;el.height=h*d;g.setTransform(d,0,0,d,0,0)};
  new ResizeObserver(rs).observe(el);rs();on('frame',f=>{if(w&&h)draw(g,w,h,f.now/1000,f.dt)})}};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
<script>
MP.spin(document.getElementById('rec'),33.3/4);
const arm=document.getElementById('arm');
// 唱臂随播放进度从外圈慢慢移向内圈，暂停时抬起归位
MP.on('frame',()=>{const s=MP.state;arm.style.transform=`rotate(${s.playing?4+(s.t/s.dur)*17+MP.level()*.6:-24}deg)`});
</script></body></html>
