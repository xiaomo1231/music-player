[package]
name = "music-player"
version = "0.4.0"
description = "Windows 综合媒体播放 / 管理软件"
edition = "2021"
rust-version = "1.80"

[lib]
name = "music_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[features]
default = []
# 打开后用 libmpv 作为播放引擎；需要把 mpv-dev 包解压到 src-tauri/lib（见 docs/开发说明.md）
mpv = ["dep:libmpv2"]

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
lofty = "0.25"
jwalk = "0.8"
notify = "8"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
encoding_rs = "0.8"
chardetng = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
once_cell = "1"
blake3 = "1"
pinyin = "0.10"
libmpv2 = { version = "7", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls", "gzip"] }
tokio = { version = "1", features = ["full"] }
keyring = { version = "3", features = ["windows-native"] }
trash = "5"
rss = "2"
base64 = "0.22"
futures-util = "0.3"
url = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
scraper = "0.24"
# 在线歌词：QQ 音乐 QRC / 酷狗 KRC 解压、网易云 eapi 加密
aes = "0.8"
md-5 = "0.10"
flate2 = "1"
hex = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
sha2 = "0.10"
librqbit = { version = "9", default-features = false, features = ["default-tls"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tract-onnx = "0.23"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
